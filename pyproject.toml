[project]
name = "study-coach-ml"
version = "0.1.0"
description = "Shared ML code (ml_core) and training pipelines for AI Study Coach"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
speech = ["soundfile>=0.12", "librosa>=0.10", "silero-vad>=5", "pyloudnorm>=0.1"]
topics = ["pymupdf>=1.24", "python-pptx>=0.6", "pytesseract>=0.3", "datasketch>=1.6"]
dev = ["pytest>=8", "ruff>=0.6", "dvc[gdrive]>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_core"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["ml_core/tests"]
