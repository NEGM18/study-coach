# Lints for the Flutter app. CI fails on any warning.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    todo: ignore

linter:
  rules:
    public_member_api_docs: false   # docs only where the code isn't obvious
    lines_longer_than_80_chars: false
